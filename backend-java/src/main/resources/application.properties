# App identity
spring.application.name=backend

# Database connection (local dev — Spring Boot runs outside Docker, so use localhost)
spring.datasource.url=jdbc:postgresql://localhost:5433/fundlyze
spring.datasource.username=fundlyze
spring.datasource.password=fundlyze123
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Server port
server.port=8080

# Python Analysis Engine
analysis.engine.base-url=http://localhost:8000